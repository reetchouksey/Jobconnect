# Fly.io app configuration for JobConnect backend.
# Rename `app` below to match what `fly launch` generated for you.
app = "jobconnect-api"
primary_region = "bom"          # Mumbai. Change to your closest region.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  DATABASE_FILE = "/data/jobconnect.db"

# Persistent SQLite storage. The volume is created with `fly volumes create`.
[[mounts]]
  source = "jobconnect_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"     # Save free-tier hours when idle
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
